<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Controller</title>
<style>
:root{--bg:#f2f2f5;--panel:#fff;--ink:#1c1c22;--mute:#6b6b78;--line:#d5d5de;--accent:#3b6cf6;--on:#fff;--btn:#e6e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121217;--panel:#1c1c24;--ink:#ececf2;--mute:#9a9aa8;--line:#34343f;--accent:#6c93ff;--on:#0b0b10;--btn:#2a2a35}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:12px;max-width:900px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=text]{width:260px;max-width:100%}
input[type=number]{width:70px}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:#c0392b}
.dot.ok{background:#2ecc71}.dot.wait{background:#f5a623}
/* controller */
.pad{touch-action:none;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"tl tr" "main main" "sticks sticks";gap:14px;padding:16px}
.shoulders{display:flex;justify-content:space-between;gap:10px}
.shoulders .grp{display:flex;gap:8px}
.mid{display:flex;justify-content:center;gap:12px}
.main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sticks{display:flex;justify-content:space-around;align-items:center}
.btn{touch-action:none;display:flex;align-items:center;justify-content:center;background:var(--btn);border:1px solid var(--line);border-radius:12px;min-width:48px;height:44px;font-weight:700;cursor:pointer;user-select:none}
.btn.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.round{border-radius:50%;width:54px;height:54px}
.small{height:32px;min-width:64px;font-size:12px;border-radius:16px}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;justify-self:center}
.face{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;justify-self:center}
.stick{position:relative;width:150px;height:150px;border-radius:50%;background:var(--btn);border:2px solid var(--line);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--accent);opacity:.9;pointer-events:none}
.trig{width:100%;max-width:90px}
pre{margin:0;max-height:180px;overflow:auto;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-all}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>

<div class="panel">
  <div class="row">
    <label>Protocol
      <select id="proto"><option value="ws">WebSocket</option><option value="http">HTTP POST</option></select>
    </label>
    <label>Target URL <input type="text" id="url" value="ws://192.168.1.50:8080/"></label>
    <label>Rate (Hz) <input type="number" id="rate" value="60" min="1" max="250"></label>
    <label>Send
      <select id="mode"><option value="change">On change + heartbeat</option><option value="always">Every tick</option></select>
    </label>
    <button class="primary" id="conn">Connect</button>
    <span class="status"><span class="dot" id="dot"></span><span id="stat">Disconnected</span></span>
  </div>
  <p class="hint">Sends a JSON snapshot of the full controller state. Keys: WASD = left stick, IJKL = right stick, arrows = D-pad, Z/X/C/V = A/B/X/Y, Q/E = bumpers, 1/3 = triggers, Enter = Start, Shift = Select.</p>
</div>

<div class="panel pad" id="pad">
  <div style="grid-area:tl" class="shoulders" id="tl"></div>
  <div style="grid-area:tr" class="shoulders" id="tr"></div>
  <div style="grid-area:main" class="main">
    <div class="dpad" id="dpad"></div>
    <div class="mid" id="mid"></div>
    <div class="face" id="face"></div>
  </div>
  <div style="grid-area:sticks" class="sticks">
    <div class="stick" id="ls"><div class="knob"></div></div>
    <div class="stick" id="rs"><div class="knob"></div></div>
  </div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <strong>Live state / log</strong>
    <button id="clr">Clear</button>
  </div>
  <pre id="state"></pre>
  <pre id="log" style="margin-top:8px"></pre>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = {
    buttons: {a:0,b:0,x:0,y:0,lb:0,rb:0,select:0,start:0,up:0,down:0,left:0,right:0,l3:0,r3:0},
    triggers: {lt:0,rt:0},
    axes: {lx:0,ly:0,rx:0,ry:0}
  };
  const stickPtr = {lx:0,ly:0,rx:0,ry:0};   // pointer contribution
  const keyAxes  = {lx:0,ly:0,rx:0,ry:0};   // keyboard contribution
  let dirty = true, seq = 0;

  const clamp = (v,a=-1,b=1) => Math.max(a, Math.min(b, v));
  const mix = () => { for (const k in S.axes) S.axes[k] = +clamp(stickPtr[k] + keyAxes[k]).toFixed(3); dirty = true; };

  /* ---------- build UI ---------- */
  const btns = {};
  function mkBtn(parent, name, label, cls='', style='') {
    const el = document.createElement('div');
    el.className = 'btn ' + cls; el.textContent = label; if (style) el.style.cssText = style;
    parent.appendChild(el); btns[name] = el;
    const set = v => setButton(name, v);
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); set(1); e.preventDefault(); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(t => el.addEventListener(t, () => set(0)));
    return el;
  }
  function setButton(name, v) {
    if (name === 'lt' || name === 'rt') S.triggers[name] = v ? 1 : 0;
    else S.buttons[name] = v ? 1 : 0;
    btns[name]?.classList.toggle('on', !!v);
    dirty = true;
  }
  mkBtn($('tl'),'lt','LT','small'); mkBtn($('tl'),'lb','LB','small');
  mkBtn($('tr'),'rb','RB','small'); mkBtn($('tr'),'rt','RT','small');
  // dpad
  const dp = $('dpad');
  const cell = (n,l,r,c) => mkBtn(dp,n,l,'',`grid-row:${r};grid-column:${c};width:50px;height:50px`);
  cell('up','▲',1,2); cell('left','◀',2,1); cell('right','▶',2,3); cell('down','▼',3,2);
  // face
  const fc = $('face');
  const fcell = (n,l,r,c) => mkBtn(fc,n,l,'round',`grid-row:${r};grid-column:${c}`);
  fcell('y','Y',1,2); fcell('x','X',2,1); fcell('b','B',2,3); fcell('a','A',3,2);
  // mid
  mkBtn($('mid'),'select','Select','small'); mkBtn($('mid'),'start','Start','small');

  /* ---------- analog sticks ---------- */
  function mkStick(el, kx, ky) {
    const knob = el.firstElementChild; let pid = null;
    const R = () => el.clientWidth / 2 - 30;
    function move(e) {
      const r = el.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
      const max = R(), d = Math.hypot(dx,dy);
      if (d > max) { dx *= max/d; dy *= max/d; }
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      stickPtr[kx] = dx/max; stickPtr[ky] = dy/max; mix();
    }
    function end() { pid = null; knob.style.transform = ''; stickPtr[kx] = stickPtr[ky] = 0; mix(); }
    el.addEventListener('pointerdown', e => { pid = e.pointerId; el.setPointerCapture(pid); move(e); e.preventDefault(); });
    el.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
    ['pointerup','pointercancel'].forEach(t => el.addEventListener(t, e => { if (e.pointerId === pid) end(); }));
    el.addEventListener('dblclick', () => { setButton(kx === 'lx' ? 'l3' : 'r3', 1); setTimeout(() => setButton(kx === 'lx' ? 'l3' : 'r3', 0), 120); });
  }
  mkStick($('ls'),'lx','ly'); mkStick($('rs'),'rx','ry');

  /* ---------- keyboard ---------- */
  const keyBtn = {z:'a',x:'b',c:'x',v:'y',q:'lb',e:'rb','1':'lt','3':'rt',Enter:'start',Shift:'select',
    ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  const keyAx = {w:['ly',-1],s:['ly',1],a:['lx',-1],d:['lx',1],i:['ry',-1],k:['ry',1],j:['rx',-1],l:['rx',1]};
  const held = new Set();
  function recalcKeys() {
    keyAxes.lx = keyAxes.ly = keyAxes.rx = keyAxes.ry = 0;
    held.forEach(k => { const m = keyAx[k]; if (m) keyAxes[m[0]] += m[1]; });
    mix();
  }
  addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (keyBtn[k] !== undefined) { setButton(keyBtn[k], 1); e.preventDefault(); }
    else if (keyAx[k] && !held.has(k)) { held.add(k); recalcKeys(); }
  });
  addEventListener('keyup', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (keyBtn[k] !== undefined) setButton(keyBtn[k], 0);
    else if (held.delete(k)) recalcKeys();
  });
  addEventListener('blur', () => { held.clear(); recalcKeys(); Object.keys(btns).forEach(n => setButton(n, 0)); });

  /* ---------- networking ---------- */
  let ws = null, timer = null, connected = false;
  const logEl = $('log');
  function log(m) {
    logEl.textContent = `[${new Date().toLocaleTimeString()}] ${m}\n` + logEl.textContent.slice(0, 4000);
  }
  function setStatus(txt, cls) { $('stat').textContent = txt; $('dot').className = 'dot ' + (cls || ''); }
  const payload = () => JSON.stringify({ type: 'controller', seq: seq++, t: Date.now(), ...S });

  async function send() {
    const body = payload();
    if ($('proto').value === 'ws') {
      if (ws && ws.readyState === 1) ws.send(body);
    } else {
      try { await fetch($('url').value, { method: 'POST', body, mode: 'no-cors', keepalive: true }); }
      catch (err) { log('HTTP error: ' + err.message); }
    }
  }
  let ticks = 0;
  function tick() {
    $('state').textContent = JSON.stringify(S);
    const hz = +$('rate').value || 60;
    const heartbeat = ++ticks >= hz;       // ~1 per second
    if ($('mode').value === 'always' || dirty || heartbeat) {
      if (heartbeat) ticks = 0;
      dirty = false; send();
    }
  }
  function start() { clearInterval(timer); timer = setInterval(tick, 1000 / clamp(+$('rate').value || 60, 1, 250)); }

  function connect() {
    const url = $('url').value.trim();
    if ($('proto').value === 'http') {
      connected = true; setStatus('Sending (HTTP)', 'ok'); log('HTTP mode → ' + url); start();
      $('conn').textContent = 'Disconnect'; return;
    }
    setStatus('Connecting…', 'wait');
    try { ws = new WebSocket(url); } catch (err) { setStatus('Bad URL', ''); log(err.message); return; }
    ws.onopen = () => { connected = true; setStatus('Connected', 'ok'); log('Connected to ' + url); $('conn').textContent = 'Disconnect'; dirty = true; start(); };
    ws.onmessage = e => log('← ' + String(e.data).slice(0, 200));
    ws.onerror = () => log('WebSocket error (check address, port, and https/ws mixed content)');
    ws.onclose = () => { if (connected) log('Closed'); disconnect(true); };
  }
  function disconnect(fromClose) {
    connected = false; clearInterval(timer);
    if (ws && !fromClose) ws.close();
    ws = null; setStatus('Disconnected', ''); $('conn').textContent = 'Connect';
  }
  $('conn').onclick = () => connected ? disconnect() : connect();
  $('rate').onchange = () => connected && start();
  $('proto').onchange = () => {
    const u = $('url'); if (connected) disconnect();
    u.value = $('proto').value === 'ws' ? u.value.replace(/^https?:/, 'ws:') : u.value.replace(/^wss?:/, 'http:');
  };
  $('clr').onclick = () => { logEl.textContent = ''; };
  $('state').textContent = JSON.stringify(S);
})();
</script>
</body>
</html>
